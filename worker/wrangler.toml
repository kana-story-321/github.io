name = "gbp-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 独自ドメインで公開します（ai-mottainai.jp は Cloudflare のDNSにあるので、DNSレコードは自動で作られます）。
# *.workers.dev のURLは使わないので閉じておきます。
workers_dev = false
routes = [{ pattern = "gbp-api.ai-mottainai.jp", custom_domain = true }]

[vars]
# 口コミページを置くURL（GitHub Pages など）。ここ以外からの呼び出しは断ります。
ALLOWED_ORIGIN = "https://gbp.ai-mottainai.jp"
# 文章の質を重視して Claude Sonnet 5.5（2026-10 にHaikuと比較して決定）。費用を抑えたいときは claude-haiku-5-5
MODEL = "claude-sonnet-5-5"
# "1" にすると http://localhost:8123 からの呼び出しも許可します（手元での確認用。本番では "0" のまま）。
ALLOW_LOCALHOST = "0"
# LINEログインのチャネルID（LINE Developers の「チャネル基本設定」）。
# 入れると図鑑をLINEアカウントに保存でき、AIの質問・文章は公式LINEの友だちだけが使えるようになります。空ならLINE連携なし。
LINE_CHANNEL_ID = "2012038645"

# ホームページ（Lovable）の営業日カレンダー・商品のデータベース。公開用の読み取りキーなので、ここに書いて大丈夫です
SITE_SUPABASE_URL = "https://thesxrduzpwrpwtytrun.supabase.co"
SITE_SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoZXN4cmR1enB3cnB3dHl0cnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MjY0OTQsImV4cCI6MjA5MTAwMjQ5NH0.-_rJA_IulbFsXufIBdicSCmiIRcIBR23AvAMPuC36c8"

# LINEの人ごとの図鑑・相棒の保存先（Cloudflare Durable Objects、無料枠で使えるSQLite版）
[[durable_objects.bindings]]
name = "USER_STATE"
class_name = "UserState"

# お店のサイトに載せる口コミの保存先
[[durable_objects.bindings]]
name = "REVIEWS"
class_name = "ReviewStore"

# 公式LINEの自動返信（お店の人の登録、お客さまごとの会話と手動対応の切り替え）
[[durable_objects.bindings]]
name = "BOT"
class_name = "ShopBot"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserState"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ReviewStore"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ShopBot"]

# 同じIPからの呼び出しを、60秒あたり20回までに制限します。
# namespace_id はアカウント内で一意の数字なら何でも構いません。
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# APIキーは秘密情報なのでここには書きません。
# GitHub Actions（.github/workflows/deploy-worker.yml）がデプロイ時に登録します。
# 手元から登録するときは:
#   npx wrangler secret put ANTHROPIC_API_KEY
