<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>保険FAQ チャット</title>
<style>
  :root {
    --navy: #1F3A5F;
    --teal: #0E7C86;
    --amber: #E8A33D;
    --plum: #7C5F8A;
    --bg: #F4F6F9;
    --line: #D7DCE3;
    --text: #1A1A1A;
    --sub: #555;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Yu Gothic UI', 'Hiragino Sans', 'Meiryo', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100%;
  }
  .app {
    display: flex; flex-direction: column;
    max-width: 720px; margin: 0 auto;
    height: 100vh;
    background: #fff;
    box-shadow: 0 0 24px rgba(0,0,0,0.06);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  header .badge {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--teal);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header .sub { margin-top: 2px; font-size: 11px; opacity: 0.75; }

  .messages {
    flex: 1; overflow-y: auto;
    padding: 16px 14px 8px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--bg);
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.bot {
    background: #fff;
    border: 1px solid var(--line);
    color: var(--text);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: var(--teal);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.handoff {
    background: #fff8ec;
    border: 1px solid var(--amber);
    color: var(--navy);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg .tag {
    display: inline-block; font-size: 10px; font-weight: bold;
    padding: 1px 6px; border-radius: 4px;
    background: var(--amber); color: #fff;
    margin-right: 6px; vertical-align: middle;
  }
  .quick {
    padding: 8px 12px;
    display: flex; flex-wrap: wrap; gap: 6px;
    border-top: 1px solid var(--line);
    background: #fff;
  }
  .quick button {
    background: #fff; color: var(--navy);
    border: 1px solid var(--teal);
    border-radius: 999px;
    padding: 6px 12px; font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .quick button:hover { background: var(--teal); color: #fff; }

  form {
    display: flex; gap: 8px;
    padding: 10px 12px 14px;
    background: #fff;
    border-top: 1px solid var(--line);
  }
  input[type=text] {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 22px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--teal); }
  button.send {
    background: var(--teal); color: #fff;
    border: none; border-radius: 22px;
    padding: 0 18px;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button.send:disabled { background: #aaa; cursor: not-allowed; }

  .loading {
    display: inline-flex; gap: 4px;
    align-items: center;
  }
  .loading span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--sub);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .loading span:nth-child(2) { animation-delay: 0.2s; }
  .loading span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="badge">💬</div>
    <div>
      <h1>保険FAQ チャット</h1>
      <div class="sub">よくあるご質問にAIが即回答します</div>
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="msg bot">
      こんにちは!保険のご相談窓口です。
気になることを日本語で入力してください。
下のボタンからもよくある質問を選べます😊
    </div>
  </div>

  <div class="quick" id="quick"></div>

  <form id="form">
    <input type="text" id="input" placeholder="質問を入力してください…" autocomplete="off">
    <button type="submit" class="send" id="send">送信</button>
  </form>
</div>

<script>
  // 開発中ローカルテスト用のURL(空にしておくと自己の doGet を叩く)
  const API = ''; // 例: 'https://script.google.com/macros/s/xxx/exec'

  const QUICK_QS = [
    '保険相談は無料ですか?',
    '資料請求はできますか?',
    'オンライン面談できますか?',
    '掛け捨てと積立の違いは?',
    '持病があっても入れますか?',
  ];

  const $ = (id) => document.getElementById(id);
  const messages = $('messages');
  const input = $('input');
  const send = $('send');

  function addMsg(text, kind, tag) {
    const el = document.createElement('div');
    el.className = 'msg ' + kind;
    if (tag) {
      const s = document.createElement('span');
      s.className = 'tag'; s.textContent = tag;
      el.appendChild(s);
    }
    el.appendChild(document.createTextNode(text));
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  function addLoading() {
    const el = document.createElement('div');
    el.className = 'msg bot';
    el.innerHTML = '<span class="loading"><span></span><span></span><span></span></span>';
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  const quick = $('quick');
  QUICK_QS.forEach(q => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = q;
    b.onclick = () => { input.value = q; ask(q); };
    quick.appendChild(b);
  });

  async function ask(q) {
    if (!q) return;
    input.value = '';
    input.disabled = true; send.disabled = true;
    addMsg(q, 'user');
    const loader = addLoading();
    try {
      const url = (API || '') + '?q=' + encodeURIComponent(q);
      const res = await fetch(url);
      const data = await res.json();
      loader.remove();
      if (data.handoff) {
        addMsg(data.text, 'handoff', '担当者へ');
      } else {
        addMsg(data.text, 'bot');
      }
    } catch (e) {
      loader.remove();
      addMsg('通信エラーが発生しました。時間を置いて再度お試しください。', 'handoff', 'エラー');
    } finally {
      input.disabled = false; send.disabled = false;
      input.focus();
    }
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    ask(input.value.trim());
  });
</script>
</body>
</html>
