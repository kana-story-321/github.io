<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: 'Yu Gothic UI', -apple-system, sans-serif; font-size: 13px; padding: 12px; margin: 0; color: #1a1a1a; }
  h2 { color: #1F3A5F; font-size: 15px; margin: 0 0 12px; }
  button {
    width: 100%; padding: 10px; background: #0E7C86; color: white;
    border: none; border-radius: 4px; font-size: 14px; font-weight: bold;
    cursor: pointer; margin-bottom: 12px;
  }
  button:hover:not(:disabled) { background: #0a6068; }
  button.secondary { background: #7C5F8A; }
  button.secondary:hover:not(:disabled) { background: #5f4770; }
  button:disabled { background: #999; cursor: wait; }
  .summary { padding: 12px; background: #F4F6F9; border-radius: 6px; border: 1px solid #D7DCE3; margin-bottom: 12px; }
  .field { margin-bottom: 10px; }
  .field-label { font-weight: bold; color: #7C5F8A; font-size: 11px; }
  .field-value { margin-top: 2px; }
  .hook { padding: 10px; background: #FFF7E0; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid #E8A33D; }
  .hook-trigger { font-weight: bold; color: #1F3A5F; font-size: 12px; }
  .hook-product { color: #0E7C86; font-weight: bold; font-size: 11px; margin: 3px 0; }
  .hook-amount { color: #C76B7A; font-size: 11px; }
  .hook-reason { font-size: 11px; margin-top: 4px; color: #1a1a1a; }
  .error { color: #C76B7A; padding: 10px; background: #FDECEA; border-radius: 4px; }
  .loading { text-align: center; padding: 20px; color: #7C5F8A; }
  hr { border: none; border-top: 1px dashed #D7DCE3; margin: 14px 0; }
</style>
</head>
<body>
<h2>📊 ライフプランAI</h2>

<button id="run" onclick="run()">▶ シミュレーション実行</button>
<button class="secondary" onclick="refresh()">📄 最新結果を表示</button>

<div id="output"></div>

<script>
  window.addEventListener('load', () => refresh());

  function run() {
    const btn = document.getElementById('run');
    btn.disabled = true; btn.textContent = '実行中… (30秒ほど)';
    document.getElementById('output').innerHTML = '<div class="loading">🤔 Gemini が計算中…</div>';
    google.script.run
      .withSuccessHandler(() => { btn.disabled = false; btn.textContent = '▶ シミュレーション実行'; refresh(); })
      .withFailureHandler(err => {
        btn.disabled = false; btn.textContent = '▶ シミュレーション実行';
        showError(err.message);
      })
      .runSimulation();
  }

  function refresh() {
    document.getElementById('output').innerHTML = '<div class="loading">読込中…</div>';
    google.script.run
      .withSuccessHandler(resp => {
        if (!resp.ok) { document.getElementById('output').innerHTML = '<div class="loading">' + escapeHtml(resp.error) + '</div>'; return; }
        showSummary(resp.summary, resp.hooks);
      })
      .withFailureHandler(err => showError(err.message))
      .getLatestSummary();
  }

  function showSummary(s, hooks) {
    let html = '<div class="summary"><div style="font-weight:bold;color:#1F3A5F;margin-bottom:8px;">■ サマリ</div>';
    Object.entries(s).forEach(([k, v]) => {
      html += `<div class="field"><div class="field-label">${escapeHtml(k)}</div><div class="field-value">${escapeHtml(String(v))}</div></div>`;
    });
    html += '</div>';

    if (hooks && hooks.length) {
      html += '<div style="font-weight:bold;color:#1F3A5F;margin:14px 0 8px;">■ 保険提案フック</div>';
      hooks.forEach(h => {
        html += `<div class="hook">
          <div class="hook-trigger">${escapeHtml(h.trigger)}</div>
          <div class="hook-product">▸ ${escapeHtml(h.product)}</div>
          <div class="hook-amount">目安: ${escapeHtml(h.amount)}</div>
          <div class="hook-reason">${escapeHtml(h.reason)}</div>
        </div>`;
      });
    }
    document.getElementById('output').innerHTML = html;
  }

  function showError(msg) {
    document.getElementById('output').innerHTML = '<div class="error">エラー: ' + escapeHtml(msg) + '</div>';
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
