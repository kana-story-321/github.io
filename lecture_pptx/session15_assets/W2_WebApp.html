<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>引受判定AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Yu Gothic UI', -apple-system, sans-serif;
    margin: 0; padding: 20px;
    background: #F4F6F9; color: #1a1a1a;
    max-width: 960px; margin: 0 auto;
  }
  header { padding: 20px 0; border-bottom: 3px solid #0E7C86; margin-bottom: 20px; }
  h1 { color: #1F3A5F; font-size: 26px; margin: 0 0 6px; }
  .subtitle { color: #7C5F8A; font-size: 14px; }

  /* Demo scenario buttons */
  .demo-panel {
    background: #FFF7E0; border-radius: 8px; padding: 16px; margin-bottom: 20px;
    border-left: 4px solid #E8A33D;
  }
  .demo-title { font-weight: bold; color: #1F3A5F; margin-bottom: 10px; font-size: 13px; }
  .demo-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .demo-btn {
    padding: 6px 12px; background: white; border: 1px solid #E8A33D;
    color: #E8A33D; border-radius: 4px; font-size: 11px; cursor: pointer;
    font-weight: bold;
  }
  .demo-btn:hover { background: #E8A33D; color: white; }

  /* Card */
  .card {
    background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  h2 {
    color: #0E7C86; font-size: 16px; margin: 0 0 12px;
    border-bottom: 2px solid #E8A33D; padding-bottom: 6px;
  }

  /* Form */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-full { grid-column: 1 / -1; }
  label {
    display: block; font-weight: bold; color: #1F3A5F;
    margin: 8px 0 4px; font-size: 12px;
  }
  input, select, textarea {
    width: 100%; padding: 8px; border: 1px solid #D7DCE3;
    border-radius: 4px; font-size: 13px; font-family: inherit; background: white;
  }
  textarea { min-height: 50px; resize: vertical; }

  /* Buttons */
  button {
    padding: 12px 24px; background: #0E7C86; color: white; border: none;
    border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  button:disabled { background: #999; cursor: wait; }
  button:hover:not(:disabled) { background: #0a6068; }
  .btn-row { display: flex; gap: 12px; justify-content: center; margin: 20px 0; }
  .btn-secondary { background: #7C5F8A; }
  .btn-secondary:hover:not(:disabled) { background: #5f4770; }

  /* Result card */
  .result-card { padding: 20px; border-radius: 8px; margin-top: 20px; }
  .verdict {
    font-size: 32px; font-weight: bold; text-align: center;
    padding: 20px; border-radius: 8px; margin-bottom: 16px;
  }
  .v-YES         { background: #E6F4EA; color: #0E7C86; }
  .v-YES-cond    { background: #FFF4D6; color: #7C5F8A; }
  .v-check       { background: #FFF7E0; color: #B8811F; }
  .v-NO          { background: #FDECEA; color: #C76B7A; }
  .v-none        { background: #ECEFF1; color: #555; }

  .field { margin-bottom: 14px; padding: 12px; background: #F4F6F9; border-radius: 6px; }
  .field-label { font-weight: bold; color: #7C5F8A; font-size: 11px; margin-bottom: 4px; }
  .field-value { color: #1a1a1a; font-size: 13px; line-height: 1.5; }
  .rule-id {
    display: inline-block; font-family: 'Menlo', monospace;
    background: #FFF7E0; padding: 3px 8px; border-radius: 4px;
    font-size: 12px; color: #1F3A5F; font-weight: bold;
  }

  .error { color: #C76B7A; padding: 12px; background: #FDECEA; border-radius: 4px; }
  .loading { text-align: center; padding: 30px; color: #7C5F8A; }
  .footer { text-align: center; color: #999; font-size: 11px; margin-top: 30px; padding: 20px; }

  @media (max-width: 640px) {
    body { padding: 10px; }
    .grid { grid-template-columns: 1fr; }
    .verdict { font-size: 24px; }
  }
</style>
</head>
<body>

<header>
  <h1>🛡 引受判定AI</h1>
  <div class="subtitle">代理店の "事前引受スクリーニング" ─ 顧客情報+検討商品 で 通るかを見立てます</div>
</header>

<!-- デモシナリオボタン -->
<div class="demo-panel">
  <div class="demo-title">💡 テストシナリオ を読込 (デモ用)</div>
  <div class="demo-buttons" id="demoButtons">
    <span class="loading" style="padding:0;font-size:11px;">読込中…</span>
  </div>
</div>

<!-- お客様情報 -->
<div class="card">
  <h2>■ お客様情報</h2>
  <div class="grid">
    <div><label>年齢</label><input id="age" type="number" placeholder="45"></div>
    <div><label>性別</label>
      <select id="gender">
        <option value="">選択</option>
        <option>男</option>
        <option>女</option>
      </select>
    </div>
    <div><label>職業</label><input id="job" type="text" placeholder="会社員"></div>
    <div><label>血圧(該当あれば)</label><input id="bp" placeholder="185mmHg 等"></div>
    <div><label>HbA1c(該当あれば)</label><input id="hba1c" placeholder="6.5 等"></div>
    <div><label>妊娠週数(該当あれば)</label><input id="pregnancy" type="number" placeholder="10"></div>
  </div>
  <label>健康状態(自由記述)</label>
  <textarea id="health" placeholder="例: 高血圧治療中(1年経過、コントロール良好)"></textarea>
  <label>既往歴</label>
  <textarea id="history" placeholder="例: 5年前に胃潰瘍で入院、完治証明あり"></textarea>
  <label>その他(希望保険金額、特記事項 など)</label>
  <textarea id="other" placeholder="例: 希望保険金 3000万円 / 3ヶ月以内に手術予定"></textarea>
</div>

<!-- 検討商品 -->
<div class="card">
  <h2>■ 検討中の商品</h2>
  <label>商品を選択</label>
  <select id="product">
    <option value="">読込中...</option>
  </select>
</div>

<div class="btn-row">
  <button id="run" onclick="run()">▶ 判定する</button>
  <button class="btn-secondary" onclick="clearForm()">✕ フォームをクリア</button>
</div>

<div id="output"></div>

<div class="footer">
  ⚠️ 本ツールは 代理店の事前見立てです。実際の引受可否は各保険会社が判断します。<br>
  顧客情報を入力する際は 個人特定できる情報(氏名・住所等)は入れないでください。
</div>

<script>
  // 起動時: 商品リスト + デモシナリオを読み込む
  window.addEventListener('load', () => {
    google.script.run
      .withSuccessHandler(resp => {
        if (!resp.ok) { alert('起動エラー: ' + resp.error); return; }
        loadProducts();
        loadDemoScenarios();
      })
      .withFailureHandler(err => alert('起動エラー: ' + err.message))
      .initForWebApp();
  });

  function loadProducts() {
    google.script.run
      .withSuccessHandler(resp => {
        const sel = document.getElementById('product');
        if (!resp.ok) {
          sel.innerHTML = '<option>読込エラー: ' + resp.error + '</option>';
          return;
        }
        sel.innerHTML = '<option value="">-- 商品を選択 --</option>';
        resp.list.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p; opt.textContent = p;
          sel.appendChild(opt);
        });
      })
      .getProductListForWebApp();
  }

  function loadDemoScenarios() {
    google.script.run
      .withSuccessHandler(scenarios => {
        const div = document.getElementById('demoButtons');
        div.innerHTML = '';
        scenarios.forEach((s, i) => {
          const btn = document.createElement('button');
          btn.className = 'demo-btn';
          btn.textContent = s.name;
          btn.type = 'button';
          btn.onclick = () => loadScenario(s);
          div.appendChild(btn);
        });
      })
      .getTestScenariosForWebApp();
  }

  function loadScenario(s) {
    document.getElementById('age').value = s.age || '';
    document.getElementById('gender').value = s.gender || '';
    document.getElementById('job').value = s.job || '';
    document.getElementById('bp').value = s.bp || '';
    document.getElementById('hba1c').value = s.hba1c || '';
    document.getElementById('pregnancy').value = s.pregnancy || '';
    document.getElementById('health').value = s.health || '';
    document.getElementById('history').value = s.history || '';
    document.getElementById('other').value = s.other || '';
    document.getElementById('product').value = s.productKey || '';
    document.getElementById('output').innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function clearForm() {
    ['age','gender','job','bp','hba1c','pregnancy','health','history','other','product']
      .forEach(id => document.getElementById(id).value = '');
    document.getElementById('output').innerHTML = '';
  }

  function run() {
    const productKey = document.getElementById('product').value;
    if (!productKey) { alert('検討中の商品を選んでください'); return; }
    if (!document.getElementById('age').value) { alert('年齢を入力してください'); return; }

    const input = {
      age: document.getElementById('age').value,
      gender: document.getElementById('gender').value,
      job: document.getElementById('job').value,
      bp: document.getElementById('bp').value,
      hba1c: document.getElementById('hba1c').value,
      pregnancy: document.getElementById('pregnancy').value,
      health: document.getElementById('health').value,
      history: document.getElementById('history').value,
      other: document.getElementById('other').value,
      productKey: productKey,
    };

    const btn = document.getElementById('run');
    btn.disabled = true; btn.textContent = '判定中… (20〜30秒)';
    document.getElementById('output').innerHTML =
      '<div class="card"><div class="loading">🤔 Gemini が判定中…</div></div>';

    google.script.run
      .withSuccessHandler(resp => {
        btn.disabled = false; btn.textContent = '▶ 判定する';
        if (!resp.ok) { showError(resp.error); return; }
        showResult(resp.result, productKey);
      })
      .withFailureHandler(err => {
        btn.disabled = false; btn.textContent = '▶ 判定する';
        showError(err.message);
      })
      .runJudgmentFromWebApp(input);
  }

  function showResult(r, productKey) {
    const cls = ({
      'YES':          'v-YES',
      'YES(条件付)': 'v-YES-cond',
      '要確認':       'v-check',
      'NO':           'v-NO',
      '該当なし':     'v-none',
    })[r.verdict] || 'v-none';

    const html = `
      <div class="card result-card">
        <h2>■ 判定結果</h2>
        <div style="text-align:center;color:#7C5F8A;font-size:12px;margin-bottom:8px;">
          ${escapeHtml(productKey)}
        </div>
        <div class="verdict ${cls}">${escapeHtml(r.verdict)}</div>

        <div class="field">
          <div class="field-label">🔗 該当した条件ID</div>
          <div class="field-value"><span class="rule-id">${escapeHtml(r.ruleId)}</span></div>
        </div>

        <div class="field">
          <div class="field-label">💭 判定理由</div>
          <div class="field-value">${escapeHtml(r.reason)}</div>
        </div>

        <div class="field">
          <div class="field-label">🎯 対応(追加確認 / NG時の代替商品 / 再申込タイミング)</div>
          <div class="field-value">${escapeHtml(r.action)}</div>
        </div>

        <div class="field">
          <div class="field-label">➡ 次のアクション</div>
          <div class="field-value">${escapeHtml(r.nextStep)}</div>
        </div>

        <div style="font-size:10px;color:#999;margin-top:14px;text-align:right;">
          ✓ 「判定履歴」シートに保存済み
        </div>
      </div>
    `;
    document.getElementById('output').innerHTML = html;
    document.getElementById('output').scrollIntoView({ behavior: 'smooth' });
  }

  function showError(msg) {
    document.getElementById('output').innerHTML =
      '<div class="card"><div class="error">エラー: ' + escapeHtml(msg) + '</div></div>';
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>

</body>
</html>
