<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>道順の動画｜Sweet Season ririo</title>
  <meta name="description" content="Sweet Season ririo（宮城県多賀城市丸山1-14-7）への道順の動画です。笠上トンネルには入らず、手前の交差点を左へ。">
  <meta property="og:title" content="Sweet Season ririo への道順">
  <meta property="og:image" content="https://gbp.ai-mottainai.jp/ririo/access/access-poster.jpg">
  <style>
    :root { --bg: #faf7f5; --ink: #3f3631; --soft: #8a7468; --rose: #c97b86; --line: #efe4dc; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; }
    h1 { font-size: 20px; margin: 4px 0 2px; text-align: center; }
    .en { text-align: center; color: var(--rose); font-style: italic; font-family: Georgia, serif; letter-spacing: 2px; margin: 8px 0 0; }
    video { display: block; width: 100%; max-height: 72vh; margin: 14px auto 0; border-radius: 16px; background: #000; }
    ol { margin: 16px 0 0; padding-left: 1.4em; line-height: 1.8; }
    .box { margin-top: 16px; padding: 12px 14px; background: #fff; border: 1px solid var(--line); border-radius: 14px; font-size: 14px; line-height: 1.7; }
    .box b { color: var(--rose); }
    a.btn { display: block; margin-top: 12px; padding: 12px; text-align: center; border-radius: 999px; background: var(--rose); color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
<main>
  <p class="en">Access</p>
  <h1>Sweet Season ririo への道順</h1>
  <video src="access.mp4" poster="access-poster.jpg" controls playsinline muted preload="metadata"></video>
  <ol>
    <li><b>笠上トンネルには入りません。</b>トンネル手前の交差点を左へ</li>
    <li>坂道を上り、道なりに進みます</li>
    <li>お店の駐車場（3台）に到着。お店の前に自動販売機があります</li>
  </ol>
  <div class="box">
    〒985-0834 宮城県多賀城市丸山1-14-7<br>
    下馬駅から徒歩7分<br>
    <b>駐車場は3台。ご利用の際は事前にご連絡ください</b>（090-2972-5054）<br>
    お店の前の自動販売機は24時間ご利用いただけます。
  </div>
  <a class="btn" href="https://www.google.com/maps/search/?api=1&query=%E5%AE%AE%E5%9F%8E%E7%9C%8C%E5%A4%9A%E8%B3%80%E5%9F%8E%E5%B8%82%E4%B8%B8%E5%B1%B11-14-7">Googleマップで開く</a>
</main>
</body>
</html>
