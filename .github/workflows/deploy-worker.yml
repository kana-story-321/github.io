# AI中継サーバー（worker/）を Cloudflare Workers に自動デプロイします。
# main ブランチの worker/ 以下が変わったとき、または Actions 画面から手動で実行したときに動きます。
#
# 必要なリポジトリシークレット（Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN   … Cloudflare の APIトークン（下記の権限）
#   CLOUDFLARE_ACCOUNT_ID  … Cloudflare のアカウントID（ダッシュボードの Workers & Pages 画面の右側に表示）
#   ANTHROPIC_API_KEY      … Claude APIキー。デプロイのたびに Worker のシークレットとして登録されます
#   REVIEW_ADMIN_KEY       … （任意）口コミ承認ページ ririo/admin.html の合言葉。未登録なら承認ページは使えません
#
# APIトークンの作り方:
#   Cloudflare ダッシュボード → My Profile → API Tokens → Create Token →
#   テンプレート「Edit Cloudflare Workers」を使い、対象を自分のアカウントと ai-mottainai.jp ゾーンだけに絞ります。
#   テンプレートに含まれる権限:
#     Account: Workers Scripts:Edit / Account Settings:Read（ほかに Workers KV・R2:Edit、Workers Tail:Read）
#     Zone:    Workers Routes:Edit（ゾーン ai-mottainai.jp）
#     User:    User Details:Read / Memberships:Read
#   独自ドメイン（gbp-api.ai-mottainai.jp）のDNSレコードを自動作成するため、
#   念のため Zone: DNS:Edit（ゾーン ai-mottainai.jp）も追加しておきます。
name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REVIEW_ADMIN_KEY: ${{ secrets.REVIEW_ADMIN_KEY }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 承認ページの合言葉は、登録してあるときだけ設定する
      - name: Set review admin key
        if: ${{ env.REVIEW_ADMIN_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$REVIEW_ADMIN_KEY" | npx wrangler secret put REVIEW_ADMIN_KEY
